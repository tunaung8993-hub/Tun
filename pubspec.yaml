name: freevpn
description: "Tun VPN Free - Fast, Secure, Free VPN"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # V2Ray/Xray VPN core
  flutter_v2ray: ^1.0.10

  # UI & navigation
  cupertino_icons: ^1.0.5
  google_fonts: ^5.1.0
  flutter_svg: ^2.0.7
  lottie: ^2.4.0
  provider: ^6.0.0
  go_router: ^13.0.0

  # Storage
  shared_preferences: ^2.2.0

  # Network utilities
  http: ^1.1.0
  connectivity_plus: ^5.0.0

  # Ads (AdMob)
  google_mobile_ads: ^4.0.0

  # Misc
  intl: ^0.18.0
  package_info_plus: ^7.0.0
  flutter_animate: ^4.2.0
  percent_indicator: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.0

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1a1a2e"
  adaptive_icon_foreground: "assets/images/app_icon_fg.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/servers/
