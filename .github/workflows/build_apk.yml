name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true
          
      - name: Install dependencies
        run: |
          flutter pub get
          # Some packages might need a fix for modern Flutter
          # flutter pub upgrade
        
      - name: Build APK
        run: |
          # Clean build to avoid cache issues
          flutter clean
          flutter pub get
          # Build with verbose output to catch errors
          flutter build apk --release --no-tree-shake-icons --verbose
        
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
